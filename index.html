<script id="data" type="application/json">{"id": "root", "label": "Building the Quaker Channel Outward", "kicker": "The whole map", "html": "<p>This book has one part for each main branch of the \"Quaker Channel\" mind map. Each sub-branch is a chapter. Each leaf of the mind map is a section.<\/p><p>The mind map comes from five notes in a Gemini Notebook. The notebook name is \"The First Nation-Farmer Climate Unity March Archive.\" The notes are Quaker Channels, Benevolent Colonialism, Colonial Legacies, Shadows of the Soil, and The Grammatical Conversion.<\/p><p>This book is for young adults, seekers, activists and young Quakers. In this book, \"we\" means Quakers and the settler communities that got land from colonial taking.<\/p><p>This book uses these terms with one meaning each:<\/p><ul><li>Channel: a two-way connection that moves knowledge between two communities.<\/li><li>Pipeline: a one-way connection that takes value from one community for the benefit of a different community.<\/li><li>Relational knowledge: knowledge that a community holds and gives only through a relationship.<\/li><li>Missing knowledge: knowledge that one person can find alone in books, archives and classrooms.<\/li><li>Waiting worship: the Quaker practice of shared silence that waits for truth to come.<\/li><li>Narrative of benevolence: the story that good intentions made Quakers free of colonial harm.<\/li><li>Active objection: open, nonviolent refusal to take part in harm, joined to repair.<\/li><\/ul><p>To use this book, do these steps:<\/p><ol><li>Read the branch map at the start of each part.<\/li><li>Read the sections of the part in sequence.<\/li><li>Write your answers to the queries in Part IV.<\/li><li>Do one action from Part V in the same week.<\/li><\/ol>", "children": [{"id": "pI", "label": "The Architecture of a Channel", "kicker": "Part I", "html": "", "children": [{"id": "c1", "label": "The Defining Principle", "kicker": "Chapter 1", "html": "<p>Knowledge moves like water through a channel. When water does not get to a field, the cause is not a lack of water. The cause is that nobody made the channel.<\/p>", "children": [{"id": "s1_1", "label": "Knowledge travels like water through channels", "kicker": "Section 1.1", "html": "<p>Think of a dry field near a full river. The field is dry because no ditch connects the river to the plants. Knowledge works in the same way.<\/p><p>The truth about a place or a people is usually already there. It is in an archive, in a family, in a ceremony or in the land. The thing that is not there is the channel that moves this truth to the people who need it.<\/p><p>This idea changes the question. Do not ask, \"Why do we not know?\" Ask, \"Which channel did nobody make, and who had the responsibility to make it?\"<\/p><p>A Quaker meeting can have many sincere people and still be a dry field. Part II shows this in Cedar County, Iowa. There, the history of a Quaker boarding school was in print for more than 100 years, but nobody taught it.<\/p><p>Water does not move in only one direction. A channel between two communities lets each community give water to the other. Chapter 3 gives this rule.<\/p><p>To find a channel that nobody made, do these steps:<\/p><ol><li>Name one truth about your area that you did not learn in school.<\/li><li>Find where this truth is now: an archive, a family, a ceremony or the land.<\/li><li>Name the people who had the responsibility to make the channel.<\/li><li>Write one action that you can do to start that channel.<\/li><\/ol>"}, {"id": "s1_2", "label": "Missing knowledge acquired alone through classrooms", "kicker": "Section 1.2", "html": "<p>Missing knowledge is knowledge that one person can find alone. Classrooms, libraries, reading lists, films and archives hold missing knowledge.<\/p><p>For example, you can find the start date of President Grant's Peace Policy in a library. You can also find how many Arapaho and Cheyenne children a Quaker agent sent to Carlisle.<\/p><p>Missing knowledge is important. It tells you what happened. It does not tell you what the history means to the people who carry it, or what they need from you now.<\/p><p>A full bookshelf and an empty calendar can exist together. Missing knowledge prepares the ground, but it does not move water between communities.<\/p><p>To find missing knowledge about your area, do these steps:<\/p><ol><li>Go to the county archive or the local library.<\/li><li>Read the local newspapers from the years near 1880.<\/li><li>Read the federal records of the Indian agencies near your area.<\/li><li>Read the testimony of boarding school survivors, for example Zitk\u00e1la-\u0160\u00e1 in The Atlantic Monthly, 1900.<\/li><li>Read local Quaker histories, for example Louis Thomas Jones, The Quakers of Iowa, 1914.<\/li><li>Write down each fact and its source.<\/li><\/ol>"}, {"id": "s1_3", "label": "Relational knowledge held in communities through presence", "kicker": "Section 1.3", "html": "<p>Relational knowledge is knowledge that a community holds and gives only through a relationship. No reading list can give it. It lives in people, in practices and in songs.<\/p><p>Communities that had extraction, study and false descriptions from settlers have good reasons to protect what is important to them. A community gives relational knowledge when the relationship is strong enough.<\/p><p>Relational knowledge needs three things: presence, trust and time. Presence means that you come in person. Trust comes slowly and goes quickly. Time means that you do not ask for results on your schedule.<\/p><p>On the 2018 March, the walkers used eight days to walk 94 miles and share stories. After the March, different groups of walkers did many projects together.<\/p><p>Relational knowledge also moves toward Quakers. Indigenous partners know much about land, water and family relationships. Quaker meetings need this knowledge, and it comes only after years of presence.<\/p><div class=\"warn\"><b>WARNING:<\/b> Do not ask a community for relational knowledge before you have a relationship. This request is extraction.<\/div><p>To build a relationship that can carry relational knowledge, do these steps:<\/p><ol><li>Find a community group that already does work near you.<\/li><li>Ask how you can help.<\/li><li>Come to the same place at the same time each week.<\/li><li>Do the work that the group asks you to do.<\/li><li>Continue for years, not weeks.<\/li><\/ol>"}]}, {"id": "c2", "label": "Spiritual Basis as Foundational Channel", "kicker": "Chapter 2", "html": "<p>Quaker spiritual practice is the first channel. It is inside each person. This inward channel gives the ability to make all outward channels.<\/p>", "children": [{"id": "s2_1", "label": "Waiting in stillness and attending to the Inner Light", "kicker": "Section 2.1", "html": "<p>At the center of Quaker practice is waiting worship. In waiting worship, Quakers sit together in silence and pay attention to the Inner Light.<\/p><p>The Inner Light is the belief that there is something of God in every person. Waiting worship has no program, no performance and no leader. Truth can come directly.<\/p><p>Waiting worship trains habits. Each week, Quakers practice silence, patience and no control of the result. Relationships across cultures need the same habits.<\/p><p>The Inner Light also has a theological effect. If God is in every person, then no person has less valuable knowledge. This belief makes a channel a meeting of equals, not charity from above.<\/p><div class=\"warn\"><b>WARNING:<\/b> If you stop the inward practice, the outward channel fills with fear, guilt and the need for praise.<\/div><p>To start a practice of waiting worship, do these steps:<\/p><ol><li>Find a Quaker meeting or a small group that meets in silence.<\/li><li>Sit with the group for one hour each week.<\/li><li>Do not speak unless you feel a strong leading.<\/li><li>Pay attention to the thoughts that come in the silence.<\/li><\/ol>"}, {"id": "s2_2", "label": "Physical preparation to listen and receive truth", "kicker": "Section 2.2", "html": "<p>Waiting worship prepares the body to listen, to give up control and to receive truth without defense. This preparation is physical, not only mental.<\/p><p>Defense often stops a channel. A settler Quaker hears hard truth about boarding schools, and the body becomes tight. The mind then gives excuses: \"They meant well.\" \"It was a different time.\" \"My family did not do this.\"<\/p><p>Each excuse is a dam across the channel. Regular silence trains a different response. The body stays open, and the breath becomes slow.<\/p><p>With this training, a person can receive truth as information, not as an attack. Then the person can sit with an angry organizer or an elder at a grave and continue to listen.<\/p><p>To prepare the body to receive hard truth, do these steps:<\/p><ol><li>Notice when your body becomes tight.<\/li><li>Breathe slowly three times.<\/li><li>Do not speak an excuse.<\/li><li>Say, \"Thank you for telling me,\" and continue to listen.<\/li><\/ol>"}]}, {"id": "c3", "label": "Rule of the Two-Way Channel", "kicker": "Chapter 3", "html": "<p>A true channel is never a pipeline. A community invites you into a channel. A channel grows over years. A channel carries spiritual and practical value in two directions.<\/p>", "children": [{"id": "s3_1", "label": "Avoid extraction and one-way pipelines", "kicker": "Section 3.1", "html": "<p>Settlers with good intentions can change a channel into a pipeline in two ways. The first way is extraction. The settler takes knowledge for personal healing, research or reputation.<\/p><p>The second way is paternal charity. The settler decides what other people need and gives it on the settler's terms. Extraction and paternal charity move in one direction only.<\/p><p>The Dakota Access Pipeline moves value out of one place for the benefit of a different place. Engineers designed it to give nothing back. Engineers design a channel for exchange.<\/p><p>The Quaker boarding school of the 1800s was a pipeline. It put Western education and Christianity into children. It took away their languages, ceremonies, families and claims to land.<\/p><p>To find out if your project is a pipeline, do these steps:<\/p><ol><li>Ask: \"Who asked for this project?\"<\/li><li>Ask: \"Who decides the next step?\"<\/li><li>Ask: \"What comes back to the community?\"<\/li><li>Ask: \"Who gets the benefit if the project succeeds?\"<\/li><li>If each answer is \"we,\" stop the project and talk with the community.<\/li><\/ol>"}, {"id": "s3_2", "label": "Carries weight in both directions across relationships", "kicker": "Section 3.2", "html": "<p>A channel carries spiritual value and practical value in two directions.<\/p><p>Quakers can give waiting worship, discernment and a long history of nonviolent action. Quakers can receive Indigenous knowledge about land as family, about ceremony and about duty to future generations.<\/p><p>Quakers can give labor, money, institutional influence and land. Quakers can receive direction, correction, friendship and a better knowledge of the place where they live.<\/p><p>The two directions do not need equal amounts at each time. The relationship as a whole must be mutual. In the first years, you can carry much soil and speak little about spirit.<\/p><p>A cistern is a closed tank. It holds water but connects to nothing. A channel is open and alive. Do not make your meeting a cistern.<\/p><p>To keep a channel two-way, do these steps:<\/p><ol><li>Wait for an invitation before you enter.<\/li><li>Write down what you give and what you receive each year.<\/li><li>Ask your partners if the relationship is mutual.<\/li><li>Change your actions when your partners tell you to change them.<\/li><\/ol>"}]}]}, {"id": "pII", "label": "Breaking the Guarded Trap", "kicker": "Part II", "html": "", "children": [{"id": "c4", "label": "The Hazard of Guarded Education", "kicker": "Chapter 4", "html": "<p>In the past, Quaker schools and meetings kept a \"guarded\" life. The guarded life kept members, especially young people, away from the secular world. The intention was spiritual integrity. The result was high walls.<\/p>", "children": [{"id": "s4_1", "label": "Insulated Friends from surrounding struggles and homelands", "kicker": "Section 4.1", "html": "<p>The guarded life gave Quakers plain dress, careful speech and schools in the country. It taught honesty, simplicity and discipline. But walls that keep the world out also keep knowledge out.<\/p><p>The walls isolated Quaker meetings and schools from political struggles near them. The walls also hid the Indigenous homelands under Quaker meetinghouses and farms. Many students learned the peace testimony but never learned about Quaker boarding schools in their own county.<\/p><p>Cedar County, Iowa, shows this clearly. At Scattergood Friends School, students did farm work, cared for the orchard and raised pigs in biology class. They had waiting worship each day at Hickory Grove Meetinghouse.<\/p><p>Two miles west of Scattergood, in West Branch, Quakers operated the Training School for Indian Children from 1881 to 1883. Benjamin and Elizabeth Miles ran it in a converted store. The federal government paid them $167 each year for each child.<\/p><p>The West Branch cemetery has two graves of children from this school. Grace Yellowhair was an Arapaho girl, age 15. She came in March 1883 and died of malaria on September 11, 1883.<\/p><p>Theodore Rogers was an Osage boy, age 8. He died of the same fever on June 15, 1883. In 1969, a Scattergood student could run within a few miles of these graves and never hear their names.<\/p><h4>The decolonial map of Cedar County<\/h4><p>The note Shadows of the Soil shows Cedar County as a decolonial map. The map compares the public record in 1969 with the Scattergood curriculum from 1966 to 1970.<\/p><div class=\"tw\"><table><tr><th>In the public record by 1969<\/th><th>In the Scattergood curriculum, 1966\u20131970<\/th><\/tr><tr><td>1883: The West Branch Local Record printed the deaths of Theodore Rogers (8) and Grace Yellowhair (15)<\/td><td>Biology: students raised pigs on the school farm<\/td><\/tr><tr><td>1880s: Federal records show Quaker agent J. D. Miles sent 227 Arapaho and Cheyenne children to Carlisle<\/td><td>Work crews: students cared for gardens and orchards<\/td><\/tr><tr><td>1900: The Atlantic Monthly printed the testimony of Zitk\u00e1la-\u0160\u00e1<\/td><td>Spiritual practice: waiting worship and study of the Quaker peace testimony<\/td><\/tr><tr><td>1914: Louis Thomas Jones described local boarding schools in The Quakers of Iowa<\/td><td>One short sentence only: \"Some Quakers went to help the Indian children\"<\/td><\/tr><\/table><\/div><p>The map shows that nobody lost this history. It was in print, in public libraries and in the ground two miles away. The relational channel was not there.<\/p><p>Grace Yellowhair stayed in that ground for 141 years. On July 22, 2024, Fred Mosqueda, Mary Fletcher and John Fletcher came from Oklahoma. They burned cedar, drummed and sang release songs at her grave. Her own people made that channel.<\/p><p>To make a decolonial map of your area, do these steps:<\/p><ol><li>Mark your meetinghouse or school on a map.<\/li><li>Mark the boarding schools, agencies and cemeteries within 50 miles.<\/li><li>Write the dates when local records first described each place.<\/li><li>Write what your meeting or school taught about each place.<\/li><li>Compare the two lists with your study group.<\/li><\/ol>"}, {"id": "s4_2", "label": "Narrative of benevolence as unexamined shield", "kicker": "Section 4.2", "html": "<p>The facts were in print. The narrative of benevolence is the reason that nobody taught them. Sincere Quakers believed that their good intentions made them free of colonial harm.<\/p><h4>Grant's Peace Policy and the false choice<\/h4><p>Under President Ulysses S. Grant's Peace Policy, the federal government gave Indian agencies and schools to churches. Quakers received some of these agencies. Quaker history often calls it the \"Quaker Policy.\"<\/p><p>After the Civil War, the U.S. Army used war and forced removal against Indigenous nations. Christian reformers and Quakers said that they offered a peaceful, humane alternative.<\/p><p>They gave a false choice between death and assimilation. They said that Indigenous people would die if they stayed sovereign and different. Their answer was forced assimilation.<\/p><p>Forced assimilation took children from their families. Schools cut the children's hair, took their clothes, stopped their languages and stopped their ceremonies. The schools taught Western subjects, manual trades and Christianity.<\/p><p>A phrase of the time was \"kill the Indian to save the man.\" Quakers thought that their schools saved children from death. Thus they thought that their work was kind and moral.<\/p><h4>Boarding schools as part of the taking of land<\/h4><p>The note Colonial Legacies gives the deeper point. Boarding schools were not a gentle alternative to the taking of land. They were a part of the taking of land.<\/p><p>The army cleared the land for settlers. The schools destroyed the cultural and relational ties that connected Indigenous nations to their land.<\/p><p>The schools did this in three ways. First, they removed tribal identity. Without that identity, nations had less unity for active objection to the division of their land.<\/p><p>Second, the schools broke the relational channels between generations. Languages, ceremonies and ecological knowledge stopped. Collective claims to land became weak, and settlers changed the land into private property.<\/p><p>Third, the schools gave moral cover. They made the taking of land look like Christian charity.<\/p><p>The boarding school destroyed Indigenous channels of knowledge on purpose. Thus a Quaker channel outward today is also a repair of channels that Quakers helped to break.<\/p><h4>How the narrative of benevolence worked<\/h4><p>The narrative of benevolence worked in three steps. First, sincerity became an excuse. Soldiers knew that they used violence, but teachers sincerely believed that they gave help.<\/p><p>Second, sincerity became a filter between generations. Teachers gave their children a clean image of Quaker goodness.<\/p><p>Third, the filter made a long silence. Nobody spoke about Grace Yellowhair and Theodore Rogers for more than 100 years.<\/p><p>Generations of settlers lived on and farmed taken land. They never examined this inheritance. The schoolroom was not separate from the taking of land. It completed the taking.<\/p><h4>Intention is not impact<\/h4><p>Good intentions do not stop harm in a system. Some Quakers talk only about the good intentions of the 1800s. This is a \"move to innocence.\" They keep a comfortable story and do not look at the results.<\/p><p>To move past the narrative of benevolence, change from regret to material accountability and relationship. Part V gives the steps.<\/p><h4>The change from \"they\" to \"we\"<\/h4><p>The note The Grammatical Conversion describes a change in Jeff's discernment. In 1969, Jeff was 16. He could not keep silent about a history that he did not know.<\/p><p>At that time, the silence was \"they.\" The adult Quaker community and the narrative of benevolence kept the channels closed. The teachers did not plan to hide the history. They lived inside a comfortable story and gave it to their children.<\/p><p>A student in that position receives the silence. The student does not make it. But an adult must change \"they did not let it reach us\" to \"we did not let it reach us.\" There are three reasons:<\/p><ul><li>Ignorance is an inherited debt. In the essay \"Why didn't I know?\", Jeff writes that his ignorance was his inheritance. Members inherit Quaker assets and Quaker debts together.<\/li><li>Quakers now get benefit from the taking. In \"Not an excuse,\" Jeff writes that Quakers continue to get benefit from colonialism. The Dakota Access Pipeline goes through farmland that settlers first took from Indigenous nations.<\/li><li>Permanent childhood is an excuse. An adult who always says \"they\" stays in the safe position of a victim. An adult who says \"we\" accepts the power to remove the filter now.<\/li><\/ul><p>In \"Three Questions, Not One,\" Jeff writes that this change is about responsibility, not guilt. A 16-year-old is not guilty. A 75-year-old Quaker is responsible for what he does with the truth now.<\/p><p>To make the change from \"they\" to \"we,\" do these steps:<\/p><ol><li>Write one sentence about Quaker history that starts with \"They.\"<\/li><li>Write the same sentence again and start it with \"We.\"<\/li><li>Read the two sentences aloud in your study group.<\/li><li>Write one action that the \"we\" sentence asks of you.<\/li><\/ol>"}]}, {"id": "c5", "label": "The Generational Imperative", "kicker": "Chapter 5", "html": "<p>Quakers cannot continue to wait behind their walls. The people who need Quaker practice most will not come through the meetinghouse door alone.<\/p>", "children": [{"id": "s5_1", "label": "Aging and declining traditional meeting memberships", "kicker": "Section 5.1", "html": "<p>Meeting membership is old and becomes smaller each year. Many meetings close. In one generation, Quaker practice can disappear from large areas.<\/p><p>Quaker practice did not fail. Nobody carried it outward. The guarded life of Chapter 4 locked the treasury. The small membership tells us to unlock it now.<\/p><h4>What the treasury holds<\/h4><ul><li>Waiting worship: shared silence with no program, where truth can come directly.<\/li><li>The Inner Light: the belief that there is something of God in every person, which makes all people spiritually equal.<\/li><li>Universal ministry: no clergy, because each person can give spiritual gifts.<\/li><li>Testing leadings in community: a group tests each personal leading through clearness committees, minutes and shared discernment.<\/li><li>Continuing revelation: God continues to speak, so a living faith stays open to new truth.<\/li><li>Testimonies (SPICES): Simplicity, Peace, Integrity, Community, Equality and Earthcare, as habits of life, not as rules on paper.<\/li><\/ul><p>To unlock the treasury in your meeting, do these steps:<\/p><ol><li>Make a card for each Quaker term in the list.<\/li><li>Write the meaning of each term in plain words on the back.<\/li><li>Give the cards to young organizers.<\/li><li>Ask the organizers which term they want to learn more about.<\/li><\/ol>"}, {"id": "s5_2", "label": "Youth drawn to authentic spiritual courage", "kicker": "Section 5.2", "html": "<p>Young people feel fear about the climate, authoritarian governments and the failure of systems. Many look for a spiritual base. Old institutions rarely show them a door.<\/p><p>Young people do not want polite committees or comfortable doctrine. They want true spiritual courage and shared survival.<\/p><p>Quaker practice already gives these things. It gives silence with meaning and decisions without bosses. It gives a long history of nonviolent active objection and a faith that is the same as daily life.<\/p><p>Young people will not accept a tradition that speaks about courage and hides its own history. Honest talk about boarding schools makes a meeting more trustworthy to young people.<\/p><p>Courage means a meeting that names its part in the harm, changes its budget, gives up some control and comes to the door of others.<\/p><p>To show spiritual courage as a meeting, do these steps:<\/p><ol><li>Tell the history of local Quaker boarding schools at a public event.<\/li><li>Change one line of the meeting budget to support Indigenous-led work.<\/li><li>Ask a young person to take a real decision role in the meeting.<\/li><\/ol>"}, {"id": "s5_3", "label": "Bringing spiritual scaffolding into public spaces", "kicker": "Section 5.3", "html": "<p>Scaffolding is a temporary structure. It supports building work, but it is not the building. Quaker scaffolding supports the work of a movement.<\/p><p>Do not wait for young people to come to old meetinghouses. Take the scaffolding into public spaces and movement spaces.<\/p><p>Examples of scaffolding are silence before a direct action and a worship-sharing circle at a mutual aid site. Other examples are a clearness committee for an organizer and waiting worship outdoors.<\/p><p>The scaffolding does not recruit members. It does not give an agenda. If some young people find Quaker practice through it, keep the meetinghouse door open and easy to find.<\/p><div class=\"warn\"><b>WARNING:<\/b> Do not use public scaffolding to get new members. This changes a channel into a pipeline.<\/div><p>To audit your meeting for barriers, do these steps:<\/p><ol><li>Ask: \"Can a stranger find our meeting time and place in one minute online?\"<\/li><li>Ask: \"Do we use words that a stranger cannot understand?\"<\/li><li>Ask: \"Do we tell the truth about our history?\"<\/li><li>Ask: \"Can a new person change how we do things?\"<\/li><li>Count the \"no\" answers. Each \"no\" is a wall. Make a plan to remove one wall this year.<\/li><\/ol>"}]}, {"id": "c6", "label": "Precedent of Spiritual Scaffolding", "kicker": "Chapter 6", "html": "<p>The 2018 First Nation-Farmer Climate Unity March shows that Quaker scaffolding is possible.<\/p>", "children": [{"id": "s6_1", "label": "2018 Climate Unity March worship-sharing calls", "kicker": "Section 6.1", "html": "<p>In September 2018, a small group of Indigenous and settler people walked 94 miles along the Dakota Access Pipeline. They walked from Des Moines to Fort Dodge, Iowa, in eight days.<\/p><p>The purpose was to share stories, so that the walkers could later work together on shared concerns. Different groups of walkers did many projects together after the March.<\/p><p>Liz, a Quaker in Minneapolis, organized a worship-sharing telephone call each day from 8:30 to 9:00 a.m. She also made an online group. Liz writes at her blog, <a href=\"https://thegoodraisedup.blogspot.com\" target=\"_blank\" rel=\"noopener\">The Good Raised Up<\/a>.<\/p><p>Each morning, Quakers who could not walk held the walkers in the Light. This scaffolding supported people who walked through rain and thunderstorms. It gave distant Quakers a role without taking attention from the March.<\/p><p>The first channel can be small. Liz gave one person, 30 minutes each day and one telephone line. She did not need a committee or money.<\/p><p>To make a daily worship-sharing call for a frontline action, do these steps:<\/p><ol><li>Ask the organizers of the action if they want this support.<\/li><li>Set one time each day for 30 minutes.<\/li><li>Send the call details to Quakers who cannot attend in person.<\/li><li>Hold the participants in the Light during the call.<\/li><li>Send a short message to the organizers after the action ends.<\/li><\/ol>"}, {"id": "s6_2", "label": "Providing contemplative spaces for frontline movements", "kicker": "Section 6.2", "html": "<p>Quakers can give contemplative spaces, calm presence and spiritual accompaniment to frontline climate and racial justice movements. They can do this without an agenda.<\/p><p>A contemplative space can be a quiet room at a long meeting or a silent hour before a hard discussion. It can also be a regular circle for tired organizers.<\/p><p>Calm presence uses the long Quaker practice of nonviolence. Spiritual accompaniment means to walk with people and hold them in the Light while they do their work.<\/p><div class=\"warn\"><b>WARNING:<\/b> Do not offer a contemplative space without an invitation from the movement.<\/div><p>To give a contemplative space to a movement, do these steps:<\/p><ol><li>Ask the movement leaders if they want a contemplative space.<\/li><li>Follow the leaders' instructions about time, place and form.<\/li><li>Keep the space quiet and simple.<\/li><li>Leave when the leaders tell you that the space is no longer necessary.<\/li><\/ol>"}]}]}, {"id": "pIII", "label": "Mechanics of Sharing Outward", "kicker": "Part III", "html": "", "children": [{"id": "c7", "label": "Postures of Exchange", "kicker": "Chapter 7", "html": "<p>A posture is how a person holds the body and the mind. These four postures show how a Quaker enters justice spaces.<\/p>", "children": [{"id": "s7_1", "label": "Do not assume you have nothing to offer", "kicker": "Section 7.1", "html": "<p>In justice spaces, settler Quakers often feel shame. Many think that they have no spiritual culture to give. This can look like humility, but often it puts the focus on the settler again.<\/p><p>To receive does not mean to have nothing. It means that you do not push your gift on others. You wait until someone asks for it.<\/p><p>A good guest brings a gift and gives it when the host makes space. A bad guest pushes presents on the host or comes with nothing and apologizes all evening.<\/p><p>Shame also stops the channel. If you think that you have nothing, partners cannot ask you for anything. Quaker tradition has failures, but it also has real gifts.<\/p><p>To prepare your gift, do these steps:<\/p><ol><li>Name one Quaker practice that you know well.<\/li><li>Practice it until you can explain it in two sentences.<\/li><li>Do not offer it until someone asks.<\/li><\/ol>"}, {"id": "s7_2", "label": "Offering silent waiting worship when asked", "kicker": "Section 7.2", "html": "<p>Indigenous leaders asked Jeff to lead prayer at a pipeline crossing near Pilot Mound, Iowa. He offered waiting worship. The people received it with hugs and tears.<\/p><p>Three things made this possible. First, the leaders asked him. Second, he gave a practice from his own tradition. He did not borrow a ceremony from a different tradition.<\/p><p>Third, silence makes no theological claim against the ceremonies of other people. It makes space. At a place with pipeline damage, silence held sorrow, thanks and strength together.<\/p><p>Silence is not always the correct gift. Know your own practices well, so that you can offer them with confidence when someone asks.<\/p><p>To lead waiting worship when someone asks, do these steps:<\/p><ol><li>Say in one sentence what waiting worship is.<\/li><li>Ask the group to sit or stand in a circle.<\/li><li>Start the silence.<\/li><li>Let any person speak if a leading comes.<\/li><li>End the silence after a time that the hosts accept.<\/li><\/ol>"}, {"id": "s7_3", "label": "Shared hardship and labor as crucible of trust", "kicker": "Section 7.3", "html": "<p>Spiritual knowledge does not move through short visits or polite panels. It needs trust. Trust comes from time, shared hardship and work side by side.<\/p><p>On the 2018 March, the walkers had thunderstorms at 3 a.m., blisters under duct tape and heavy equipment to carry each day. The hardship removed pretense. Then the walkers could share deep spiritual truths.<\/p><p>The same is true in less dramatic places. Pack food boxes each Saturday with a mutual aid group. Carry soil at a land project. Come to the same work crew each week.<\/p><p>The work is not a means to an end. The work makes the channel.<\/p><p>Scattergood students also worked together on the land, but that work stayed inside the guarded walls. Shared work across the boundary changes a good habit into a channel.<\/p><p>To build trust through shared labor, do these steps:<\/p><ol><li>Join a work crew that a frontline community leads.<\/li><li>Come to each work day for one year.<\/li><li>Do the hard and boring jobs.<\/li><li>Talk about spiritual matters only when your partners start the topic.<\/li><\/ol>"}, {"id": "s7_4", "label": "Two-Eyed Seeing with Indigenous knowledge", "kicker": "Section 7.4", "html": "<p>Mi'kmaw Elder Albert Marshall teaches \"Two-Eyed Seeing.\" One eye sees with Indigenous knowledge. The other eye sees with Western knowledge. A person learns to use the two eyes together.<\/p><p>The Quaker belief in the Light in all things is similar to Indigenous Traditional Ecological Knowledge. That knowledge treats land, water, rocks and trees as family.<\/p><p>Neither tradition must absorb the other. Two eyes give depth that one eye cannot give.<\/p><p>Two-Eyed Seeing prevents two errors. The first error says that only Western knowledge is real. The second error copies Indigenous practices as a whole, which is extraction.<\/p><p>Jeff's own life shows three stages. Stage one was solitary witness: a bicycle journey and a vision of smog in 1971. Stage two was shared accompaniment on the 2018 March. Stage three was material solidarity in work weeks at Maiden Lane in Iowa City.<\/p><div class=\"warn\"><b>WARNING:<\/b> Do not copy Indigenous ceremonies into Quaker practice. This is extraction.<\/div><p>To practice Two-Eyed Seeing, do these steps:<\/p><ol><li>Learn what Indigenous teachers in your area choose to share about the land.<\/li><li>Learn what your own Quaker tradition says about the Light in creation.<\/li><li>Write where the two teachings agree and where they are different.<\/li><li>Keep each teaching with its own people.<\/li><\/ol>"}]}]}, {"id": "pIV", "label": "Dynamic Queries for Seekers", "kicker": "Part IV", "html": "<p>A Quaker query is not a test with correct answers. It is a light that you point at your inner life and your community life.<\/p>", "children": [{"id": "c8", "label": "Key Spiritual Inquiries", "kicker": "Chapter 8", "html": "<p>To use each query in this chapter, do these steps:<\/p><ol><li>Read the query aloud in your group.<\/li><li>Sit in silence for five minutes.<\/li><li>Let each person speak once, without discussion.<\/li><li>Write your own answer after the meeting.<\/li><\/ol>", "children": [{"id": "s8_1", "label": "Moving spiritual life beyond walls of comfort", "kicker": "Section 8.1", "html": "<blockquote class=\"q\"><b>Query.<\/b> Where is a wall of comfort around my spiritual life, and which channel must I open to let it move into public spaces?<\/blockquote><p>Comfort is not bad. People need rest, beauty and safe community. But comfort becomes a wall when it decides that some places, people and truths are too difficult.<\/p><p>The guarded life of Part II made walls on purpose. Each person can also make walls without knowing.<\/p><p>This query asks for a specific answer. Do not say, \"I must be more active.\" Name the wall and name the channel.<\/p><ul><li>What do I not do because it makes me uncomfortable?<\/li><li>Which practice that I already have can I give in a public place?<\/li><\/ul>"}, {"id": "s8_2", "label": "Distinguishing solitary witness from relational repair", "kicker": "Section 8.2", "html": "<blockquote class=\"q\"><b>Query.<\/b> Do I mistake solitary witness, which keeps my hands clean, for relational repair, which puts my body in places of mutual accountability?<\/blockquote><p>Solitary witness has a long Quaker history. Examples are refusal to pay war taxes, refusal to fight and a simple life. These actions are important.<\/p><p>But solitary witness can become a project of personal purity. Its goal is a clean conscience. The goal of relational repair is a repaired relationship.<\/p><p>Solitary witness answers to conscience. Relational repair answers to a community that has good reasons to doubt you. Chapter 7 shows the change from a solitary bicycle journey to years of work under the direction of others.<\/p><ul><li>Which of my actions are mostly about my own integrity?<\/li><li>To whom am I accountable for my justice work, and do they know it?<\/li><\/ul>"}, {"id": "s8_3", "label": "Utilizing silent waiting for social collapse", "kicker": "Section 8.3", "html": "<blockquote class=\"q\"><b>Query.<\/b> Which practices does our community have, for example waiting worship, discernment or nonviolent active objection, that can help neighbors in climate and social collapse?<\/blockquote><p>This query asks how to use the treasury of Chapter 5. Waiting worship can calm people with too much fear. Clearness committees can help organizers make hard decisions without burnout or division.<\/p><p>A long history of nonviolent active objection gives practical training and spiritual strength under pressure.<\/p><p>Many young people already expect systems to fail. A spiritual practice that cannot speak to this expectation will have no audience. A practice that gives calm without denial will have an audience.<\/p><ul><li>Which of our practices is most useful in a crisis, and did we ever give it to people outside the meeting?<\/li><li>How can we teach these practices in plain words and keep their depth?<\/li><\/ul>"}, {"id": "s8_4", "label": "Listening first in cross-cultural spaces", "kicker": "Section 8.4", "html": "<blockquote class=\"q\"><b>Query.<\/b> In movement spaces of a different culture, can I listen first, follow directions and wait for an invitation to share spiritual gifts?<\/blockquote><p>This query puts the four postures of Part III into one discipline. Each part is easy to say and hard to do. It is hardest for people who usually lead.<\/p><p>Quakers already practice these disciplines in waiting worship each week. They wait, they do not speak quickly, and they let the group discern. The challenge is to do the same as a guest.<\/p><ul><li>When did I last follow directions from a person of a different culture on a practical task, and how did I feel?<\/li><li>What do I do when I want to fix, explain or lead?<\/li><\/ul>"}, {"id": "s8_5", "label": "Making meetinghouse doors visible to youth", "kicker": "Section 8.5", "html": "<blockquote class=\"q\"><b>Query.<\/b> How can our meeting make its door always visible to young people who need spiritual meaning and do hard mutual aid work?<\/blockquote><p>Many young people already do the hardest work. They feed neighbors, organize and care for each other in crisis. Many do not have a spiritual home that understands this work.<\/p><p>Some young people can find this home with Quakers if they can see the door. A sign is not sufficient.<\/p><p>A visible door needs meeting times that fit work schedules and worship in places where young people already are. It needs plain words, honest history and real power for new people.<\/p><p>\"Always\" is important. One outreach event opens the door one time. A visible door stays open.<\/p><ul><li>If a young mutual aid organizer came to our meeting next week, what would make them come back, and what would make them leave?<\/li><li>How can our meeting go to their door first?<\/li><\/ul>"}]}]}, {"id": "pV", "label": "From Spiritual Channel to Material Action", "kicker": "Part V", "html": "<p>A channel is real only when material value moves through it.<\/p>", "children": [{"id": "c9", "label": "Beyond Progressive Regret", "kicker": "Chapter 9", "html": "<p>Progressive regret happens when Quakers learn the history, feel bad, say so in public and do nothing more.<\/p>", "children": [{"id": "s9_1", "label": "Avoiding white guilt combined with proximity", "kicker": "Section 9.1", "html": "<p>Sikowis Nobiss founded and leads the Great Plains Action Society. She gives a warning. Faith communities often show \"a cocktail of white guilt combined with a desire to be in proximity to Indigenous folks.\" This combination causes no action.<\/p><p>Guilt puts the focus on the feelings of the settler. The wish for proximity puts the focus on the settler's wish to be near and to be seen as an ally. Neither asks what Indigenous partners need.<\/p><p>Do not stop caring, and do not stay away. Change guilt into responsibility, as Chapter 4 shows. Change the wish for proximity into work under direction, even when nobody sees the work.<\/p><div class=\"warn\"><b>WARNING:<\/b> Do not ask Indigenous partners to make you feel better about your guilt. This is extraction.<\/div><p>To change guilt into responsibility, do these steps:<\/p><ol><li>Ask your Indigenous partners what they need.<\/li><li>Write down their answer without changes.<\/li><li>Choose one need that you can meet.<\/li><li>Meet that need on a regular schedule.<\/li><\/ol>"}, {"id": "s9_2", "label": "Knowledge without material transfer is an intellectual alibi", "kicker": "Section 9.2", "html": "<p>Spiritual knowledge without material transfer is a move to innocence. It is an alibi.<\/p><p>Part I gave two types of knowledge. Part II showed how the narrative of benevolence let a community keep a clean conscience and get benefit from the taking of land.<\/p><p>A reader who learns about Grace Yellowhair and Theodore Rogers and changes nothing repeats the old pattern. Sincere feeling takes the place of material change.<\/p><p>Knowledge is a channel only if value moves through it. Chapter 10 gives four types of value.<\/p><p>To change knowledge into material transfer, do these steps:<\/p><ol><li>Choose one of the four currencies in Chapter 10.<\/li><li>Write a specific amount of time, money, influence or land.<\/li><li>Start the transfer this month.<\/li><\/ol>"}]}, {"id": "c10", "label": "Four Currencies of Public Witness", "kicker": "Chapter 10", "html": "<p>Quaker witness becomes material through four currencies. The list goes from the most personal currency to the most structural currency.<\/p>", "children": [{"id": "s10_1", "label": "Labor under direction in mutual aid collectives", "kicker": "Section 10.1", "html": "<p>The first currency is labor. Labor under direction is physical work that other people direct. Examples are: clean out buildings, carry soil, and pack food boxes on Saturday mornings with mutual aid groups.<\/p><p>Quakers are good at organizing. This becomes a weakness when Quakers change each gift into a Quaker project. Labor under direction means that you come when asked, do the necessary work and let the community plan.<\/p><p>Jeff worked for three years with Ronnie James at Des Moines Mutual Aid. He also did work weeks at the Great Plains Action Society land in Iowa City. The work is ordinary. Regular work over many years builds trust.<\/p><div class=\"warn\"><b>WARNING:<\/b> Do not take control of the plan. The community directs the work.<\/div><p>To give labor under direction, do these steps:<\/p><ol><li>Find a mutual aid group near you.<\/li><li>Ask when the group needs workers.<\/li><li>Come at that time each week.<\/li><li>Do the task that the group leader gives you.<\/li><\/ol>"}, {"id": "s10_2", "label": "Institutional weight and minuting commitments", "kicker": "Section 10.2", "html": "<p>The second currency is institutional influence. Meetings and Quaker organizations have platforms, reputations and access that one person does not have.<\/p><p>To use institutional influence, give your platforms to Indigenous speakers. Go with Indigenous groups to talk to legislators about protections, for example Savanna's Act. Record binding commitments in minutes.<\/p><p>A minute records the decision of a Quaker meeting. A minute can commit the meeting to a regular transfer, a land relationship or a yearly act of accountability. A minute stays after the first people leave.<\/p><p>Quaker meetings operated the boarding schools. Quaker meetings can now give their names, money and influence to Indigenous-led work.<\/p><p>To record a commitment in a minute, do these steps:<\/p><ol><li>Ask your Indigenous partners which support they want from the meeting.<\/li><li>Write a draft minute that names the support, the amount and the schedule.<\/li><li>Bring the draft to the meeting for business.<\/li><li>Record the minute when the meeting agrees.<\/li><li>Read the minute again each year and report on the result.<\/li><\/ol>"}, {"id": "s10_3", "label": "Unrestricted money as an obligatory honor tax", "kicker": "Section 10.3", "html": "<p>The third currency is unrestricted money. Give it on a regular schedule as an honor tax, not as charity.<\/p><p>Charity means that the giver decides, the gift is optional and the receiver must be grateful. An honor tax is different. It is a debt, it continues each year, and the receiver decides how to use it.<\/p><p>\"Unrestricted\" means no conditions. Do not ask for reports that show how the receiver used the money.<\/p><p>Iowa Yearly Meeting (Conservative) gave its full peace-and-justice budget to support the film They Found Us. A small meeting can use the same method at a smaller scale.<\/p><p>To start an honor tax, do these steps:<\/p><ol><li>Choose a percentage of your meeting budget or personal income.<\/li><li>Choose an Indigenous-led organization with your partners' advice.<\/li><li>Set a regular payment, for example each month.<\/li><li>Do not add conditions to the payment.<\/li><\/ol>"}, {"id": "s10_4", "label": "Land return supporting Indigenous stewardship", "kicker": "Section 10.4", "html": "<p>The fourth currency is land. LANDBACK is not a metaphor. It means that settlers return physical land to Indigenous care.<\/p><p>An example is the Urban Resilience Hub of the Great Plains Action Society. It is at 810 Maiden Lane in Iowa City and has 1.2 acres. The Decolonial Repair Network supports this land with work weeks. Sikowis Nobiss and Eric Anglada started the Decolonial Repair Network.<\/p><p>The boarding schools of Part II helped the taking of land. Settler Quakers live, worship and farm on taken land. A true channel outward must carry the land question.<\/p><p>Not every meeting can return land now. Every meeting can examine the land that it holds and how it got that land.<\/p><p>To start the land question in your meeting, do these steps:<\/p><ol><li>Find the deed and the history of your meetinghouse land.<\/li><li>Find which Indigenous nation lived on that land.<\/li><li>Ask Indigenous-led land projects near you what support they need.<\/li><li>Give labor, money or land to one land project.<\/li><\/ol>"}]}]}], "closing": "<p>Knowledge moves like water through a channel. When water does not get to a field, the cause is that nobody made the channel. A channel becomes honest only through work after the reading stops.<\/p><p>Do not finish this book with more words and an empty calendar. Do these steps:<\/p><ol><li>Find a place of silence near you.<\/li><li>Open the county archives.<\/li><li>Go to a door that a frontline community already opened.<\/li><li>Choose a weekly schedule of work and keep it.<\/li><li>Put your hands in the soil.<\/li><\/ol>"}</script>
<script>
const root = JSON.parse(document.getElementById('data').textContent);
const byId = {}; const parent = {};
(function idx(n,p,d){ n.depth=d; byId[n.id]=n; if(p) parent[n.id]=p; n.open = d<1; (n.children||[]).forEach(c=>idx(c,n,d+1)); })(root,null,0);
const W = [210, 220, 230, 300], GAP = [56, 50, 50, 0], VGAP = 10;
const canvas = document.getElementById('canvas'), svg = document.getElementById('wires'), stage = document.getElementById('stage'), panel = document.getElementById('panel');
let selected = root.id, scale = 1, tx = 20, ty = 20;
const colX = d => { let x = 0; for (let i = 0; i < d; i++) x += W[i] + GAP[i]; return x; };

function layout(h){
  let y = 0; const pos = {};
  (function place(n){
    const kids = n.open ? (n.children||[]) : [];
    if (!kids.length){ pos[n.id] = y + h[n.id]/2; y += h[n.id] + VGAP; return; }
    const start = y;
    kids.forEach(place);
    let c = (pos[kids[0].id] + pos[kids[kids.length-1].id]) / 2;
    if (c - h[n.id]/2 < start) { const shift = start + h[n.id]/2 - c; kids.forEach(k=>shiftAll(k,shift,pos)); c += shift; y += shift; }
    if (c + h[n.id]/2 + VGAP > y) y = c + h[n.id]/2 + VGAP;
    pos[n.id] = c;
  })(root);
  return pos;
}
function shiftAll(n,s,pos){ pos[n.id]+=s; if(n.open)(n.children||[]).forEach(k=>shiftAll(k,s,pos)); }
function render(){
  canvas.querySelectorAll('.node').forEach(e=>e.remove());
  let paths = '';
  const els = {};
  (function draw(n){
    const el = document.createElement('div');
    el.className = 'node d'+n.depth + (n.id===selected?' sel':'');
    el.style.setProperty('--w', W[n.depth]+'px');
    el.style.left = colX(n.depth)+'px'; el.tabIndex = 0; el.setAttribute('role','button');
    const has = (n.children||[]).length;
    el.innerHTML = '<span class="lbl"></span>' + (has ? '<span class="tog" aria-hidden="true">'+(n.open?'−':'+')+'</span>' : '');
    el.querySelector('.lbl').textContent = n.label;
    el.setAttribute('aria-expanded', has ? String(n.open) : 'false');
    el.onclick = ev => { ev.stopPropagation(); clickNode(n); };
    el.onkeydown = ev => { if (ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); clickNode(n); } };
    canvas.appendChild(el); els[n.id] = el;
    if (n.open) (n.children||[]).forEach(draw);
  })(root);
  // vertically center each node on its row and draw wires
  const hs = {}; Object.entries(els).forEach(([id,el])=>hs[id]=el.offsetHeight);
  const pos = layout(hs);
  Object.entries(els).forEach(([id,el])=>{ el.style.top = (pos[id] - hs[id]/2) + 'px'; });
  (function wire(n){
    if (!n.open) return;
    const a = els[n.id];
    (n.children||[]).forEach(c=>{
      const b = els[c.id];
      const x1 = a.offsetLeft + a.offsetWidth, y1 = a.offsetTop + a.offsetHeight/2;
      const x2 = b.offsetLeft, y2 = b.offsetTop + b.offsetHeight/2, mx = (x1+x2)/2;
      paths += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
      wire(c);
    });
  })(root);
  svg.innerHTML = paths;
  apply();
}
function clickNode(n){
  if ((n.children||[]).length) n.open = !n.open || n.id!==selected ? (n.id===selected ? !n.open : true) : false;
  selected = n.id; render(); show(n); centerOn(n);
}
function trail(n){ const t=[]; let p=parent[n.id]; while(p){ t.unshift(p); p=parent[p.id]; } return t; }
function flat(){ const out=[]; (function f(n){ out.push(n); (n.children||[]).forEach(f); })(root); return out; }
function show(n){
  const t = trail(n);
  let h = '';
  if (t.length) h += '<div class="crumbs">' + t.map(p=>`<span data-go="${p.id}">${esc(p.label)}</span>`).join(' › ') + '</div>';
  h += `<div class="kick">${esc(n.kicker||'')}</div><h2>${esc(n.label)}</h2>` + n.html;
  if ((n.children||[]).length){
    h += '<div class="kids"><h5>Branches</h5>' + n.children.map(c=>`<button data-go="${c.id}">${esc(c.label)}</button>`).join('') + '</div>';
  }
  if (n.closing) h += '<div class="closing"><div class="kick">Closing instructions</div>' + n.closing + '</div>';
  const all = flat(), i = all.indexOf(n);
  h += '<div class="nav">' + (i>0?`<button data-go="${all[i-1].id}">← ${esc(all[i-1].label)}</button>`:'<span></span>') + (i<all.length-1?`<button data-go="${all[i+1].id}">${esc(all[i+1].label)} →</button>`:'') + '</div>';
  panel.innerHTML = h; panel.scrollTop = 0;
  panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(byId[b.dataset.go]));
}
function go(n){ trail(n).forEach(p=>p.open=true); if((n.children||[]).length) n.open=true; selected=n.id; render(); show(n); centerOn(n); }
function centerOn(n){
  const el = [...canvas.querySelectorAll('.node')].find(e=>e.classList.contains('sel')); if(!el) return;
  const r = stage.getBoundingClientRect();
  const cx = el.offsetLeft + el.offsetWidth/2, cy = el.offsetTop + el.offsetHeight/2;
  const sx = cx*scale + tx, sy = cy*scale + ty;
  const lx = el.offsetLeft*scale + tx, rx = (el.offsetLeft+el.offsetWidth)*scale + tx;
  if (lx < 10 || rx > r.width-10 || sy < 40 || sy > r.height-40){ tx = r.width/2 - cx*scale; ty = r.height/2 - cy*scale; apply(); }
}
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function apply(){ canvas.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
function fit(){
  const nodes = [...canvas.querySelectorAll('.node')]; if(!nodes.length) return;
  let w=0,h=0; nodes.forEach(e=>{ w=Math.max(w,e.offsetLeft+e.offsetWidth); h=Math.max(h,e.offsetTop+e.offsetHeight); });
  const r = stage.getBoundingClientRect();
  scale = Math.max(0.35, Math.min(1.2, (r.width-40)/w, (r.height-40)/h));
  tx = (r.width - w*scale)/2; ty = Math.max(20,(r.height - h*scale)/2); apply();
}
function zoom(f, cx, cy){
  const r = stage.getBoundingClientRect(); cx = cx ?? r.width/2; cy = cy ?? r.height/2;
  const ns = Math.max(0.3, Math.min(2.2, scale*f));
  tx = cx - (cx-tx)*ns/scale; ty = cy - (cy-ty)*ns/scale; scale = ns; apply();
}
document.getElementById('expand').onclick = ()=>{ flat().forEach(n=>n.open=true); render(); fit(); };
document.getElementById('collapse').onclick = ()=>{ flat().forEach(n=>n.open=n.depth<1); selected=root.id; render(); fit(); show(root); };
document.getElementById('zin').onclick = ()=>zoom(1.2);
document.getElementById('zout').onclick = ()=>zoom(1/1.2);
document.getElementById('fit').onclick = fit;
stage.addEventListener('wheel', e=>{ e.preventDefault(); const r=stage.getBoundingClientRect(); zoom(e.deltaY<0?1.1:1/1.1, e.clientX-r.left, e.clientY-r.top); }, {passive:false});
let drag=null;
stage.addEventListener('pointerdown', e=>{ if(e.target.closest('.node')) return; drag={x:e.clientX,y:e.clientY,tx,ty}; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e=>{ if(!drag) return; tx=drag.tx+e.clientX-drag.x; ty=drag.ty+e.clientY-drag.y; apply(); });
stage.addEventListener('pointerup', ()=>{ drag=null; stage.classList.remove('drag'); });
window.addEventListener('resize', ()=>{});
render(); fit(); show(root);
</script>
</body>
