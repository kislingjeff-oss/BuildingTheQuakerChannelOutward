<script id="data" type="application/json">{"id": "root", "label": "Building the Quaker Channel Outward", "html": "<p>This map unfolds Jeff Kisling's book <i>Building the Quaker Channel Outward<\/i> one branch at a time. It has five main branches, ten sub-branches and twenty-nine leaves. Click any branch to open it, and this panel shows what that branch reveals. Use the arrows at the bottom of the panel to read straight through.<\/p><p>The book grows from a single idea: knowledge travels like water through channels. Where water does not reach, it is not because the water does not exist, but because the channel has not been built. It asks how Friends can build a channel outward, to share Quaker spirituality with frontline and other oppressed communities, while staying accountable to our own history.<\/p><p>It is written for young adults, seekers, grassroots activists, and young Friends searching for spiritual grounding, collective resilience, and an honest decolonial practice. When the book says \"we,\" it means the Society of Friends and the settler communities who inherited both its testimonies and its complicity.<\/p>", "children": [{"id": "pI", "label": "The Architecture of a Channel", "kicker": "Part I", "html": "<p>Before anything can be shared outward, we need to understand how knowledge moves at all. The first branch of the map lays down the architecture: knowledge behaves like water, some of it can be fetched alone while some can only be carried through relationship, the inward life of Friends is the first channel from which all others are dug, and every true channel runs both ways.<\/p>", "children": [{"id": "c1", "label": "The Defining Principle", "kicker": "Chapter 1", "html": "<p>The defining principle of this whole book fits in a sentence: where water does not reach, it is not because the water does not exist, but because the channel has not been built. Everything else is commentary on that sentence.<\/p>", "children": [{"id": "s1_1", "label": "Knowledge travels like water through channels", "kicker": "Section 1.1", "html": "<p>Think of a dry field beside a full river. The field is not dry because the world lacks water. It is dry because no ditch, no headgate, no furrow connects the river to the roots. Knowledge works the same way. The truth about a place, a people, or a history is usually already present somewhere: in an archive, in a family, in a ceremony, in the soil itself. What is missing is the channel that would carry it to the people who need it.<\/p><p>This reframing matters because it changes the question we ask. Instead of \"Why don't we know?\" we ask \"What channel was never built, and who was responsible for building it?\" The first question leaves us passive, waiting for information to arrive. The second makes us builders. A channel is dug, maintained, cleared of silt, and walked along. It is work, and it is shared work.<\/p><p>The image also explains why good intentions are not enough. A meeting can be full of sincere, peace-loving people and still be a field the water never reaches. Part II shows exactly how that happened in Cedar County, Iowa, where the history of a Quaker-run boarding school was in print for more than a century and still never reached the students of a Quaker school two miles away.<\/p><p>Finally, water does not flow in only one direction by nature. It finds its level. A channel that connects two communities lets each irrigate the other. That is the root of the two-way rule in Chapter 3.<\/p>"}, {"id": "s1_2", "label": "Missing knowledge acquired alone through classrooms", "kicker": "Section 1.2", "html": "<p>The source notes draw a sharp line between two kinds of knowledge. The first is missing knowledge. It can be acquired alone: through classrooms, libraries, reading lists, documentaries, and archives. If you want to learn when President Grant's Peace Policy began, or how many Arapaho and Cheyenne youth a Quaker agent sent to Carlisle, you can find it by yourself with a library card and some patience.<\/p><p>Missing knowledge is real and it matters. Much of the work of decolonial study begins here: opening the county archives, reading the federal ledgers, finding the 1883 death notices in the West Branch Local Record, reading Zitk\u00e1la-\u0160\u00e1's survivor testimony from 1900, and reading Louis Thomas Jones's The Quakers of Iowa from 1914. A person who does that reading is better prepared than one who does not.<\/p><p>But missing knowledge has a limit. It can tell you what happened. It cannot by itself tell you what it means to the people who carry it, what they need from you now, or how to be trusted. Reading about a community is not the same as being in relationship with it. A full bookshelf can coexist with an empty calendar, and the closing charge of this book warns against exactly that.<\/p><p>So missing knowledge is the first ditch, not the whole irrigation system. It prepares the ground. It does not yet carry water across the boundary between peoples.<\/p>"}, {"id": "s1_3", "label": "Relational knowledge held in communities through presence", "kicker": "Section 1.3", "html": "<p>The second kind is withheld or relational knowledge. It is held in communities and can travel only across relationships built on presence, trust, and unhurried time. No reading list can deliver it, because it is not stored on paper. It lives in people, in practices, in the way a song is sung over a grave, in the way a community decides whom to trust.<\/p><p>\"Withheld\" here is not an accusation. Communities that have been extracted from, studied, photographed, and misrepresented have every reason to guard what is precious. Relational knowledge is offered when the relationship can bear its weight, and not before.<\/p><p>This is why the source notes keep returning to the same ingredients: presence, trust, and time. Presence means showing up in body, not just in sympathy. Trust is earned slowly and lost quickly. Unhurried time means refusing the settler habit of wanting results on our schedule. On the 2018 First Nation-Farmer Climate Unity March, the eight days of walking were themselves the point: the group spent the time it took to walk 94 miles sharing stories with each other so that they could work together afterward on things of common concern.<\/p><p>Relational knowledge also flows toward Friends. Indigenous partners carry knowledge of land, water, and kinship that Quaker meetings badly need. That knowledge will not arrive through a webinar. It arrives through years of showing up.<\/p>"}]}, {"id": "c2", "label": "Spiritual Basis as Foundational Channel", "kicker": "Chapter 2", "html": "<p>The second sub-branch makes a claim that surprises some activists: Quaker spiritual formation is not an abstract theory or a private hobby. It is the primary inward channel that creates the capacity to build every outward channel.<\/p>", "children": [{"id": "s2_1", "label": "Waiting in stillness and attending to the Inner Light", "kicker": "Section 2.1", "html": "<p>At the center of Quaker practice is waiting worship: a gathered silence in which Friends attend to the Inner Light, the conviction that there is that of God in every person. In that silence there is no program, no performance, and no one in charge. Truth is allowed to surface directly.<\/p><p>This discipline is a training ground. Every week, Friends practice not filling the silence, not rushing to speak, not deciding in advance what the outcome should be. Those are exactly the habits that cross-cultural relationship demands. Someone who has learned to sit for an hour without needing to control the room is better prepared to sit in a circle led by others without needing to control that room either.<\/p><p>The Inner Light also does theological work. If there is that of God in every person, then there is no one whose knowledge is beneath us and no one whose suffering is outside our concern. That conviction is the spiritual foundation for both equality and solidarity. It is why the outward channel is not charity from above but a meeting of equals.<\/p><p>So the channel outward begins inward. A Friend who neglects the inward channel will soon find the outward one silting up with anxiety, guilt, and the need to be seen doing good.<\/p>"}, {"id": "s2_2", "label": "Physical preparation to listen and receive truth", "kicker": "Section 2.2", "html": "<p>The source notes put it plainly: the inward discipline of waiting in stillness prepares the physical body to listen, relinquish control, and receive truth without becoming defensive. This is embodied preparation, not only intellectual.<\/p><p>Defensiveness is one of the most common ways channels collapse. A settler Friend hears hard truth about boarding schools or land taking and the body tightens. The mind rushes to explanations: they meant well, it was a different time, my family was not involved. Each of those reflexes is a dam across the channel.<\/p><p>Regular stillness trains a different response. The body learns to stay open while hearing something painful. The breath slows. The urge to justify loosens. What remains is the ability to receive truth as information rather than as attack. That capacity is what makes it possible to sit with an Arapaho elder at a grave, or with a frontline organizer who is angry, and keep listening.<\/p><p>Seen this way, meeting for worship is a kind of physical conditioning for justice work. It does not replace showing up. It makes showing up survivable and fruitful.<\/p>"}]}, {"id": "c3", "label": "Rule of the Two-Way Channel", "kicker": "Chapter 3", "html": "<p>The third sub-branch sets the rule that keeps all of this honest: a true channel is never a one-way pipeline. It is entered by invitation, cultivated over years, and must carry spiritual and practical weight in both directions.<\/p>", "children": [{"id": "s3_1", "label": "Avoid extraction and one-way pipelines", "kicker": "Section 3.1", "html": "<p>There are two classic ways that well-meaning settlers turn a channel into a pipeline. The first is extraction: taking knowledge from marginalized groups for our own benefit, our own healing, our own research, or our own reputation. The second is paternalistic charity: instructing others, deciding what they need, and delivering it on our terms. Both flow only one way, and both repeat the logic of colonialism in a gentler voice.<\/p><p>Jeff's wider body of writing calls this the difference between reciprocity and extraction. A pipeline, like the Dakota Access Pipeline that the 2018 March followed, moves something valuable out of one place for the benefit of another. It is engineered not to return anything. A channel is engineered for exchange.<\/p><p>The nineteenth-century Quaker boarding school was, in this sense, a one-way pipeline dressed as a gift. It poured Western education, Christianity, and manual trades into children while draining away their languages, ceremonies, families, and claims to land. Part II traces that history in detail. The lesson for today is simple: any project in which Friends only give or only take should be examined for the old pattern.<\/p><p>Practical tests help. Who asked for this? Who decides what happens next? What flows back? Who benefits if it succeeds? If the answers all point toward us, the channel is a pipeline.<\/p>"}, {"id": "s3_2", "label": "Carries weight in both directions across relationships", "kicker": "Section 3.2", "html": "<p>A real channel carries weight in both directions, and the weight is both spiritual and practical. Spiritually, Friends may offer silent worship, discernment practices, and long experience of nonviolent witness, and may receive Indigenous understanding of land as kin, of ceremony, and of responsibility across generations. Practically, Friends may offer labor, money, institutional weight, and land, and may receive direction, correction, friendship, and a truer understanding of where they live.<\/p><p>Entering by invitation means waiting to be asked. Cultivating over years means accepting that the first several years may involve a lot of carrying soil and very little conversation about spirit. Both directions does not mean equal amounts at every moment. It means the relationship as a whole is mutual, and that neither side is only a resource for the other.<\/p><p>The interactive guide imagined in the source notes would show this as a contrast between an \"isolated cistern,\" a closed spiritual enclave that holds water but connects to nothing, and a \"living irrigation channel,\" a two-way flow connecting Quaker contemplative practice with frontline movements. A cistern is safe but stagnant. A channel is exposed, and alive.<\/p>"}]}]}, {"id": "pII", "label": "Breaking the Guarded Trap", "kicker": "Part II", "html": "<p>If the first branch explains how channels work, the second explains why the Quaker channel was never built. The answer is a habit of guardedness that protected Friends from the world, and a story of benevolence that protected them from their own history. This is the longest Part because four of the five source notes feed into it.<\/p>", "children": [{"id": "c4", "label": "The Hazard of Guarded Education", "kicker": "Chapter 4", "html": "<p>Historically, Quaker education and meeting life emphasized a \"guarded\" existence, designed to shield members, especially young people, from worldly or secular contamination. The intent was quiet spiritual integrity. The effect was a set of high institutional walls.<\/p>", "children": [{"id": "s4_1", "label": "Insulated Friends from surrounding struggles and homelands", "kicker": "Section 4.1", "html": "<p>Guarded education was meant to protect. It produced plain dress, careful speech, schools set apart in the countryside, and a community that looked inward. Much of what it cultivated was good: honesty, simplicity, discipline, a habit of worship. But walls that keep the world out also keep the world's knowledge out.<\/p><p>The guarded tradition insulated Quaker meetings and schools from the political struggles around them and severed awareness of the living Indigenous homelands on which their meetinghouses and farms stood. Generations of students were educated in peace testimonies and social justice without ever learning about the assimilationist schools their own meetings operated in their own home counties.<\/p><p>Cedar County, Iowa, is the clearest example in Jeff's own life. At Scattergood Friends School, class of 1970, students lived a hands-on, land-based education: communal farm work crews, orchard care, sophomore biology raising pigs, and daily waiting worship at Hickory Grove Meetinghouse. It was an education built around personal integrity and social justice. And it operated in complete structural isolation from the historical trauma embedded in the soil around it.<\/p><p>Two miles west, in the town of West Branch, a Quaker-operated forced-assimilation school, the Training School for Indian Children, ran from 1881 to 1883 in a converted storefront, under Benjamin and Elizabeth Miles. They received a federal stipend of $167 per year for the keep of each child taken from their family under President Grant's Peace Policy. In the Friends' section of the West Branch municipal cemetery lie Grace Yellowhair, a fifteen-year-old Arapaho girl who arrived in mid-March 1883 and died of malaria on September 11, 1883, after a lingering two-month illness, and Theodore Rogers, an eight-year-old Osage boy who died of the same fever on June 15, 1883.<\/p><p>A student running the gravel roads around Scattergood in 1969 could pass within a few miles of those graves without ever hearing their names. That is what insulation looks like from the inside: not a lie told, but a channel never dug.<\/p><h4>The decolonial map of Cedar County<\/h4><p>The source note Shadows of the Soil lays this out as a decolonial map. Cedar County is \"the geography of simultaneity and physical proximity,\" where a progressive, guarded Quaker education took place two miles from the unmarked graves of Native children. The map's most telling feature is a split screen comparing what was already in the public record by 1969 with what reached the Scattergood curriculum between 1966 and 1970.<\/p><div class=\"tw\"><table><tr><th>In the public archives by 1969<\/th><th>On the Scattergood curriculum, 1966\u20131970<\/th><\/tr><tr><td>1883: Death notices for Theodore Rogers (8) and Grace Yellowhair (15) published in the West Branch Local Record<\/td><td>Sophomore biology: hands-on agricultural education raising pigs on the school farm<\/td><\/tr><tr><td>1880s: Federal ledgers record Quaker Agent J. D. Miles transferring 227 Arapaho and Cheyenne youth to Carlisle<\/td><td>Daily work crews: shared labor maintaining vegetable gardens and orchards<\/td><\/tr><tr><td>1900: Zitk\u00e1la-\u0160\u00e1's survivor testimony published in The Atlantic Monthly<\/td><td>Spiritual formation: quiet worship, study of historic Quaker peace witness, testing personal integrity<\/td><\/tr><tr><td>1914: Louis Thomas Jones's The Quakers of Iowa details local assimilation schools<\/td><td>The benevolent fragment: a single sanitized substitute, \"Some Quakers went to help the Indian children\"<\/td><\/tr><\/table><\/div><p>The structural finding follows directly. The history was never lost or missing. It was in print, in public libraries, and in the soil two miles away. What was missing was the relational channel a community needs in order to face its own complicity and teach the truth. This is the Defining Principle from Chapter 1, proven on a single county map.<\/p><p>Grace Yellowhair's spirit remained in that ground for 141 years, until July 22, 2024, when Arapaho outreach specialist Fred Mosqueda, his wife Mary Fletcher, and John Fletcher traveled from Oklahoma to burn cedar, drum, and sing traditional release songs over her grave. That act was itself a channel, built by her own people, reaching a place the Quaker channel had never reached.<\/p>"}, {"id": "s4_2", "label": "Narrative of benevolence as unexamined shield", "kicker": "Section 4.2", "html": "<p>Why did the channel stay unbuilt for so long, when the facts were in print? The source notes name the cause: the narrative of benevolence. Sincere Quakers believed their good intentions exempted them from complicity, and that belief functioned as an unexamined shield.<\/p><h4>Grant's Peace Policy and the false binary<\/h4><p>Under President Ulysses S. Grant's Peace Policy, often called the \"Quaker Policy\" in Friends' history, the federal government turned over the administration of Indian agencies and schools to religious denominations, including the Society of Friends. In the post-Civil War era, federal Indian policy was dominated by military conquest, forced removal, and armed campaigns by the U.S. Army. Against that violence, Christian reformers and Quakers presented themselves as advocates of a peaceful and humane alternative.<\/p><p>Their argument was a false binary: extermination or assimilation. Native people, they said, faced physical extinction if they remained sovereign and culturally distinct in the path of settler expansion. The proposed solution was forced cultural assimilation: taking children from their families, cutting their hair, stripping them of traditional dress, suppressing their languages, forbidding their ceremonies, and educating them in Western academic subjects, manual trades, and Christianity. The era's slogan said it all: \"kill the Indian to save the man.\" Because Friends saw themselves as shielding Native people from slaughter, they experienced their mission as moral, philanthropic, and merciful.<\/p><h4>Boarding schools as machinery of dispossession<\/h4><p>The note Colonial Legacies makes the deeper point. Boarding schools were not a gentle alternative to land taking. They were an integral part of the machinery of dispossession. Military force cleared the physical path for settlement; schools were designed to dismantle the sovereign, cultural, and relational foundations that anchored Indigenous nations to their territories.<\/p><p>They did this in three ways. First, they eliminated sovereign obstacles to settler expansion: by extinguishing distinct tribal identity and nationhood, they disarmed the cohesion that allowed Native nations to make organized collective objection to the taking and dividing of their homelands. Second, they replaced relational connection with the mechanics of assimilation: removing children broke the relational channels through which languages, ceremonies, and ecological knowledge passed between generations, weakening collective claims to ancestral territory and easing its conversion into commodified settler property. Third, they did ideological work: they provided moral cover and legitimacy for the broader process of land theft.<\/p><p>Notice the language of channels. The boarding school was a deliberate act of destroying Indigenous channels of knowledge. Building a Quaker channel outward today cannot be separated from that history; in part it is an act of repair for channels Friends helped to break.<\/p><h4>How the shield worked<\/h4><p>The narrative of benevolence worked in three steps. Sincerity became an alibi: soldiers knew they were using lethal force, but school administrators and teachers sincerely believed they were offering sanctuary and help. Sincerity then became an intergenerational filter: because their motives felt righteous, they passed down an unblemished self-image of goodness to their descendants, undisturbed. And the filter produced a long silence: the deaths of Grace Yellowhair and Theodore Rogers, two miles from Scattergood, went unexamined and unmentioned for well over a century.<\/p><p>The result is what Colonial Legacies calls shielding descendants from complicity. Generations of settlers occupied, farmed, and profited from homelands that had been taken, without ever confronting their direct inheritance of colonial taking. Cultural erasure inside a schoolhouse was not separate from land theft. It was an indispensable instrument that completed and legitimized the taking.<\/p><h4>Intent is not impact<\/h4><p>Sincere good intentions do not neutralize systemic harm. When modern Friends look back at the Peace Policy and focus only on the good intentions of nineteenth-century Quakers, that focus functions as an intellectual move to innocence: a way to keep a comfortable story of moral superiority without facing what actually happened. Moving beyond the benevolent alibi means recognizing that genuine repair requires shifting from progressive regret to material accountability and relationship. Part V takes up exactly that shift.<\/p><h4>The grammatical conversion: from \"they\" to \"we\"<\/h4><p>The fifth source note, The Grammatical Conversion of Quaker Responsibility, records a turn in Jeff's own discernment. As a sixteen-year-old in 1969, he could not withhold what he did not know existed. At that point the silence really was a \"they\": maintained by the adult Quaker community, the institutional meetings, and a narrative of benevolence that kept the channels unbuilt. His teachers and parents were not running a conspiracy. They were living inside a comfortable story of good intentions and passing it on. A student in that position is the recipient of a structural omission, not its author.<\/p><p>But the move from \"they did not let it reach us\" to \"we did not let it reach us\" is the central ethical turn of adult discernment, for three reasons.<\/p><ul><li>Ignorance as an inherited liability. As Jeff writes in his essay \"Why didn't I know?\", his ignorance was not his invention, but it was his inheritance. Joining a religious society or a settler community means inheriting its assets, such as oak groves, peace testimonies, and stories of the Underground Railroad, and also its unresolved spiritual and material liabilities. If we gladly accept credit for nineteenth-century Quaker abolitionists we never met, we must also accept responsibility for the boarding schools run by those same meetings.<\/li><li>Present-day beneficiaries of the taking. In \"Not an excuse,\" Jeff observes that completing the passive sentence with the active one helps Friends address our current condition as people who continue to benefit from colonialism. The taking was done by a past \"they,\" but the present security, wealth, and land-adjacent comfort are held by \"us.\" The pipeline the 2018 March followed sits on a double taking: farmland taken from present owners, which was first taken by force from Indigenous nations to make room for settler farming.<\/li><li>The trap of permanent childhood. Staying forever in the posture of \"they did not let it reach us\" can become its own move to innocence, keeping an adult in the safe grammatical position of a victim of a bad 1960s curriculum rather than a present-day adult with the agency to dismantle the filter now.<\/li><\/ul><p>Choosing \"we\" is an act of institutional and spiritual solidarity: this is my religious society, these are my ancestors, and I will not pretend their actions have nothing to do with me. As Jeff writes in \"Three Questions, Not One,\" the conversion is finally about the difference between guilt and responsibility. A teenager was not guilty of what his community withheld in 1969. A seventy-five-year-old Friend today, and the wider Society of Friends, are responsible for what they do with the truth now that it has arrived. The \"we\" is not an indictment of youth but a covenant for the present.<\/p>"}]}, {"id": "c5", "label": "The Generational Imperative", "kicker": "Chapter 5", "html": "<p>The second sub-branch of Part II turns from the past to the future. Friends cannot keep waiting behind their walls, because the people who most need what Quakers carry are not going to walk through the meetinghouse door on their own.<\/p>", "children": [{"id": "s5_1", "label": "Aging and declining traditional meeting memberships", "kicker": "Section 5.1", "html": "<p>Meeting membership is aging and declining. Many meetings are being laid down. This is not offered as a lament but as a fact that changes the stakes. A spiritual tradition that has accumulated more than three centuries of tested practice could quietly disappear from whole regions within a generation, not because its practices failed, but because they were never carried outward.<\/p><p>The source notes call this the unconnected treasury. Friends possess an ancient, tested body of spiritual technology that remains largely locked behind meetinghouse doors and insulated within a shrinking membership. The guarded habits of Chapter 4 explain how the treasury got locked. Declining numbers explain why the key must be turned now.<\/p><h4>What the treasury holds<\/h4><ul><li>Silent waiting worship: a communal contemplative practice that refuses programmatic noise and creates a gathered sanctuary where truth can surface directly.<\/li><li>The universal Inner Light: the radical conviction that there is that of God in every person, establishing complete spiritual equality across every boundary.<\/li><li>Universal ministry: the abolition of clerical hierarchy and the understanding that every person is a minister with gifts to offer.<\/li><li>Testing leadings in community: the discipline of recognizing that an inward leading is not self-certifying; it must be seasoned, tested, and held by a discerning body through clearness committees, minutes, and corporate discernment.<\/li><li>Continuing revelation: the conviction that God did not stop speaking centuries ago, that truth keeps arriving, and that a living faith must stay open to what it has not yet received.<\/li><li>Living testimonies (SPICES): Simplicity, Peace, Integrity, Community, Equality, and Earthcare, lived not as doctrines to sign but as embodied habits.<\/li><\/ul><p>The source notes imagine a \"Quaker Technology Deck,\" a set of flip cards translating terms like Waiting Worship, The Leading, Clearness, and Continuing Revelation out of seventeenth-century jargon into plain, usable language for young organizers. The point is translation, not dilution.<\/p>"}, {"id": "s5_2", "label": "Youth drawn to authentic spiritual courage", "kicker": "Section 5.2", "html": "<p>Young people facing climate dread, authoritarianism, and systemic collapse are actively searching for spiritual grounding. Yet traditional institutions rarely offer them a visible entry point. They are not looking for polite committees or comfortable doctrine. They are drawn to authentic, uncompromised spiritual courage and to collective survival.<\/p><p>This is good news for Friends, if they are willing to hear it. The things young seekers want are things Quakers already practice at their best: silence that is not empty, community decision-making without bosses, a long history of nonviolent active objection, and a refusal to separate faith from how one lives. What young people will not accept is a tradition that speaks of courage while hiding from its own history. Honesty about the boarding schools is not a liability in reaching the young; it is a credential.<\/p><p>Courage here does not mean dramatic gestures. It means a meeting willing to name its complicity, change its budget, give up some control, and show up at someone else's door. Young people can tell the difference between a community that performs values and one that pays for them.<\/p>"}, {"id": "s5_3", "label": "Bringing spiritual scaffolding into public spaces", "kicker": "Section 5.3", "html": "<p>To prepare the channel, Friends must stop waiting for young people to walk into historic meetinghouses and instead bring spiritual scaffolding out into the public square and into movement spaces.<\/p><p>Scaffolding is a useful word. It is temporary structure that supports building work without becoming the building. Quaker scaffolding in public might look like a time of silence offered before a direct action, a worship-sharing circle at a mutual aid site, a clearness process lent to an organizer facing a hard decision, or a regular, visible hour of waiting worship held outdoors where anyone may join.<\/p><p>The scaffolding serves the movement's own work. It does not recruit members, impose an agenda, or set the terms. If, along the way, some young people discover that this practice has a name and a community, the meetinghouse doors should be open and easy to find. The source notes suggest a \"Meetinghouse Barrier Audit,\" a self-scoring checklist that helps a meeting ask whether it is acting as a \"gated museum\" or an \"open harbor.\"<\/p>"}]}, {"id": "c6", "label": "Precedent of Spiritual Scaffolding", "kicker": "Chapter 6", "html": "<p>None of this is hypothetical. The third sub-branch of Part II points to a precedent: the 2018 First Nation-Farmer Climate Unity March.<\/p>", "children": [{"id": "s6_1", "label": "2018 Climate Unity March worship-sharing calls", "kicker": "Section 6.1", "html": "<p>In September 2018, a small group of Native and non-Native people walked 94 miles along the route of the Dakota Access Pipeline, from Des Moines to Fort Dodge, Iowa, over eight days. The purpose was to spend those days sharing stories so that the walkers could later work together on things of common concern. That purpose was fulfilled: various combinations of the marchers have worked together on many projects since.<\/p><p>During the march, Liz, a Friend in Minneapolis, organized a daily 8:30 to 9:00 a.m. worship-sharing conference call and an online group. Each morning, Friends who could not walk held the marchers in the Light. Liz writes at her blog, <a href=\"https://thegoodraisedup.blogspot.com\" target=\"_blank\" rel=\"noopener\">The Good Raised Up<\/a>. This was invisible spiritual infrastructure. It upheld people walking through rain and thunderstorms, and it gave distant Friends a real role in a frontline action without pulling focus from it.<\/p><p>The precedent shows how small the first channel can be. What Liz offered was one person, one half-hour a day, one phone line. It did not need a committee or a budget. It needed someone willing to offer a Quaker practice in service of something Friends did not lead.<\/p>"}, {"id": "s6_2", "label": "Providing contemplative spaces for frontline movements", "kicker": "Section 6.2", "html": "<p>The wider lesson is that Friends can provide contemplative spaces, de-escalation presence, and spiritual accompaniment for frontline climate and racial justice movements without imposing an agenda.<\/p><p>Contemplative space might be a quiet room at a long gathering, a silent hour before a hard negotiation, or a regular circle for organizers facing burnout. De-escalation presence draws on long Quaker experience of nonviolence and of staying calm under pressure. Spiritual accompaniment means walking alongside, often literally, and holding people in the Light while they do the work they have chosen.<\/p><p>The test of all three is the same as the two-way rule: were we invited, are we following direction, and does the movement own what happens? When the answers are yes, the Quaker channel becomes what it was always meant to be: water reaching a dry field, without the field having to become a meetinghouse.<\/p>"}]}]}, {"id": "pIII", "label": "Mechanics of Sharing Outward", "kicker": "Part III", "html": "<p>The third branch of the map moves from why to how. It has a single sub-branch, Postures of Exchange, with four leaves. Together they describe the stance a Friend takes when stepping into decolonial and justice spaces: neither empty-handed nor pushy, patient, physically present, and open to a second way of seeing.<\/p>", "children": [{"id": "c7", "label": "Postures of Exchange", "kicker": "Chapter 7", "html": "<p>A posture is how a body holds itself. These four postures are about how Friends hold themselves in encounter, crucible, and mutual exchange.<\/p>", "children": [{"id": "s7_1", "label": "Do not assume you have nothing to offer", "kicker": "Section 7.1", "html": "<p>In decolonial and justice spaces, white and settler Quakers often collapse into shame, or assume they have no spiritual culture of their own to offer. This can look like humility. Often it is another way of making the encounter about ourselves.<\/p><p>A true posture of receiving does not mean having nothing. It means not imposing what you carry beforehand, and waiting to be asked. A guest who arrives with a gift in the car, and offers it only when the host makes room, is different both from a guest who barges in with presents and from a guest who arrives with nothing and apologizes all evening.<\/p><p>Shame also has a practical cost. A Friend who has decided they have nothing to offer cannot be asked for anything, and so cannot fully enter the two-way channel. Partners who are generous enough to ask deserve a real answer. The Quaker tradition, with all its failures, carries real gifts. Bringing them, quietly, is part of accountability, not a contradiction of it.<\/p>"}, {"id": "s7_2", "label": "Offering silent waiting worship when asked", "kicker": "Section 7.2", "html": "<p>The clearest example in the source notes comes from Jeff's own experience. Native leaders asked him to lead prayers at a pipeline crossing outside Pilot Mound, Iowa. He offered silent Quaker waiting worship. It was warmly received, with hugs and tears.<\/p><p>Several things made that moment possible. He was asked; he did not volunteer a ceremony. He offered what was authentically his own tradition rather than borrowing someone else's. And silence, unlike many forms of prayer, makes no theological claims that compete with the ceremonies of others. It creates room. In a place scarred by a pipeline, a shared silence could hold grief, gratitude, and resolve without forcing them into words.<\/p><p>The lesson is not that silence is always the right gift. It is that Friends should know their own practices well enough to offer them with confidence when invited, and should be ready to be invited.<\/p>"}, {"id": "s7_3", "label": "Shared hardship and labor as crucible of trust", "kicker": "Section 7.3", "html": "<p>Spiritual knowledge does not travel across casual encounters or polite panel discussions. It requires what the source notes call an infrastructure of trust, built through unhurried time, shared physical struggle, and side-by-side labor.<\/p><p>On the 2018 March, that infrastructure was built in specific moments: thunderstorms at three in the morning, raw blisters nursed under duct tape, gear hauled together day after day. Hardship stripped away pretense. People who have been soaked, exhausted, and cared for by each other talk differently than people who have only shared a conference room. In those conditions deep spiritual truths could be exchanged.<\/p><p>The same holds in less dramatic settings. Packing food boxes on Saturday mornings with a mutual aid collective, hauling soil at a land project, or showing up week after week to the same work crew all build the crucible. The labor is not a means to an end. It is the channel being dug.<\/p><p>There is an echo here of Scattergood's own work crews, where students learned to labor together on the land. The difference is direction: that labor stayed inside the guarded walls. Shared labor across the boundary is what turns a good habit into a channel.<\/p>"}, {"id": "s7_4", "label": "Two-Eyed Seeing with Indigenous knowledge", "kicker": "Section 7.4", "html": "<p>Mi'kmaw Elder Albert Marshall's concept of \"Two-Eyed Seeing\" means learning to see with the strengths of Indigenous ways of knowing through one eye and the strengths of Western or settler ways through the other, and learning to use both eyes together.<\/p><p>For Friends, there is a natural kinship to explore here, carefully. The Quaker recognition of the Light within all things resonates with Indigenous Traditional Ecological Knowledge, which treats land, water, rocks, and trees as living relatives. Neither tradition needs to be absorbed into the other. Two eyes see depth that one eye cannot.<\/p><p>Two-Eyed Seeing also guards against two errors. One is the old colonial error of treating Western knowledge as the only real knowledge. The other is a newer error, in which settlers try to adopt Indigenous practices wholesale, which is another form of extraction. Two eyes means each keeps its own sight, and the depth comes from their cooperation.<\/p><p>The source notes imagine a \"Timeline of Encounters\" tracing this growth across one life: from solitary witness (a 1971 bicycle journey and a vision of smog), to shared accompaniment (the 2018 March crossings), to material solidarity (work weeks at Maiden Lane in Iowa City). Each stage widened the view.<\/p>"}]}]}, {"id": "pIV", "label": "Dynamic Queries for Seekers", "kicker": "Part IV", "html": "<p>Quaker queries are not tests with answers in the back of the book. They are searchlights held to the inward and communal life. The fourth branch of the map gathers five queries for young adults and seekers. Each section below opens the query, offers some reflection, and closes with questions for a reader, a study group, or a meeting to sit with.<\/p>", "children": [{"id": "c8", "label": "Key Spiritual Inquiries", "kicker": "Chapter 8", "html": "<p>These queries are meant to be read slowly, ideally aloud in a group, with silence between them.<\/p>", "children": [{"id": "s8_1", "label": "Moving spiritual life beyond walls of comfort", "kicker": "Section 8.1", "html": "<blockquote class=\"q\"><b>Query.<\/b> Where is my spiritual life currently trapped behind a wall of comfort, and what channel would I have to open to let it flow into the public square?<\/blockquote><p>Comfort is not the enemy. Rest, beauty, and safe community are needed. But comfort becomes a wall when it decides in advance which places, people, and truths are too much. The guarded tradition of Part II built such walls on purpose. Individual Friends build their own without noticing.<\/p><p>This query asks for a concrete answer. Not \"I should be more engaged,\" but which wall, and which channel. Perhaps it is a weekly practice that could move outdoors. Perhaps it is a relationship that has stayed online and needs to become physical. Perhaps it is a part of local history that has not yet been read.<\/p><ul><li>What do I avoid because it would make me uncomfortable, and what might be waiting on the other side?<\/li><li>What is one practice I already have that could be offered in a public setting?<\/li><\/ul>"}, {"id": "s8_2", "label": "Distinguishing solitary witness from relational repair", "kicker": "Section 8.2", "html": "<blockquote class=\"q\"><b>Query.<\/b> Am I confusing solitary moral witness, keeping my own hands clean, with relational repair, putting my body in spaces of mutual accountability?<\/blockquote><p>Solitary witness has a long and honorable Quaker history. Refusing to pay war taxes, refusing to fight, simplifying one's life: these matter. But solitary witness can quietly become a project of personal purity. Its aim is a clean conscience. Relational repair aims at a mended relationship, and it requires other people who can tell you whether you are getting it right.<\/p><p>The difference shows up in accountability. A solitary witness answers to conscience. Relational repair answers to a community, often one that has every reason to be skeptical. The Timeline of Encounters in Chapter 7 describes exactly this movement: from a young man's solitary bicycle witness to years of shared work under others' direction.<\/p><ul><li>Which of my commitments are mainly about my own integrity, and which put me in relationship with people affected by the harm?<\/li><li>To whom am I accountable for my justice work, and do they know it?<\/li><\/ul>"}, {"id": "s8_3", "label": "Utilizing silent waiting for social collapse", "kicker": "Section 8.3", "html": "<blockquote class=\"q\"><b>Query.<\/b> What unique spiritual practices, such as silent waiting, discernment, or nonviolent active objection, does our community possess that could serve neighbors facing climate and social collapse?<\/blockquote><p>This query takes the unconnected treasury of Chapter 5 and asks how it might be spent. Silent waiting can steady people overwhelmed by dread. Discernment processes like clearness committees can help organizers make hard choices without burning out or splitting apart. A long tradition of nonviolent active objection offers both practical training and spiritual grounding for staying peaceful under pressure.<\/p><p>\"Collapse\" is a hard word, and the source notes use it deliberately. Many young people already live with the expectation that systems they depend on will fail. A spirituality that cannot speak to that experience will not be heard. One that can offer steadiness without denial will be.<\/p><ul><li>Which of our practices would be most useful in a crisis, and have we ever offered them to anyone outside the meeting?<\/li><li>How could we teach those practices in plain language without losing their depth?<\/li><\/ul>"}, {"id": "s8_4", "label": "Listening first in cross-cultural spaces", "kicker": "Section 8.4", "html": "<blockquote class=\"q\"><b>Query.<\/b> When entering cross-cultural movement spaces, can I maintain the discipline to listen first, take direction on physical tasks, and wait to share my spiritual gifts until asked?<\/blockquote><p>This query gathers the postures of Part III into a single discipline. Listen first. Take direction, especially on physical work where settler habits of taking charge show up quickly. Wait to be asked before offering spiritual gifts. Each part is easy to say and hard to practice, particularly for people used to leading.<\/p><p>The good news is that Friends already practice these disciplines every week in meeting for worship: waiting, not rushing to speak, letting the gathered body discern. The challenge is carrying that discipline into spaces where Friends are guests.<\/p><ul><li>When was the last time I took direction from someone of a different culture on a practical task, and how did it feel?<\/li><li>What do I do with the urge to fix, explain, or lead?<\/li><\/ul>"}, {"id": "s8_5", "label": "Making meetinghouse doors visible to youth", "kicker": "Section 8.5", "html": "<blockquote class=\"q\"><b>Query.<\/b> How can our meeting or community make its doors permanently visible to young people who are already starving for spiritual meaning while doing exhausting mutual aid work?<\/blockquote><p>Many young people are already doing the hardest parts of the work: feeding neighbors, organizing, caring for each other through crisis. What they often lack is a spiritual home that understands that work and can sustain them in it. Some would find that home among Friends if they could see the door.<\/p><p>Visibility means more than a sign. It means meeting times that fit working lives, worship held where young people already are, language without insider jargon, honesty about the Society's history, and real power for new people to shape the community. \"Permanently\" matters too: a single outreach event is a door opened once. A visible door stays open.<\/p><ul><li>If a young mutual aid organizer walked into our meeting next week, what would make them come back, and what would make them leave?<\/li><li>What would it look like for our meeting to show up at their door first?<\/li><\/ul>"}]}]}, {"id": "pV", "label": "From Spiritual Channel to Material Action", "kicker": "Part V", "html": "<p>The final branch of the map is where the channel is tested. The source notes call it the converted ledger. Spiritual insight that never becomes material transfer has not finished its journey. This Part names the trap that stops the flow, and then four currencies through which a channel becomes real.<\/p>", "children": [{"id": "c9", "label": "Beyond Progressive Regret", "kicker": "Chapter 9", "html": "<p>Progressive regret is what happens when Friends learn the history, feel bad about it, say so in public, and stop there.<\/p>", "children": [{"id": "s9_1", "label": "Avoiding white guilt combined with proximity", "kicker": "Section 9.1", "html": "<p>Sikowis Nobiss, founder and leader of the Great Plains Action Society, offers a diagnostic warning: faith communities often fall into a \"cocktail of white guilt combined with a desire to be in proximity to Indigenous folks,\" and that cocktail leads only to inaction.<\/p><p>Both ingredients are familiar. Guilt centers the settler's feelings. Proximity centers the settler's wish to be near, to be seen as an ally, to learn and be changed. Neither asks what Indigenous partners actually need. Mixed together they produce a lot of emotion and very little transfer of anything.<\/p><p>The way out is not to stop caring or to stay away. It is to redirect. Guilt can become responsibility, as Chapter 4 described in the move from \"they\" to \"we.\" Desire for proximity can become a willingness to work under direction, even at a distance, even when the work is unglamorous and no one is watching.<\/p>"}, {"id": "s9_2", "label": "Knowledge without material transfer is an intellectual alibi", "kicker": "Section 9.2", "html": "<p>The source notes state it bluntly: spiritual knowledge without material transfer is an intellectual move to innocence. It is an alibi.<\/p><p>This brings the book full circle. Part I distinguished missing knowledge from relational knowledge. Part II showed how the narrative of benevolence let a whole community keep a clean conscience while profiting from taking. A Friend who reads this book, learns about Grace Yellowhair and Theodore Rogers, and changes nothing has repeated the pattern in a new key: sincere feeling standing in for material change.<\/p><p>Knowledge is a channel only if something flows through it. The next chapter names what should flow.<\/p>"}]}, {"id": "c10", "label": "Four Currencies of Public Witness", "kicker": "Chapter 10", "html": "<p>The source notes name four currencies through which Quaker witness becomes material. They are listed roughly from the most personal to the most structural.<\/p>", "children": [{"id": "s10_1", "label": "Labor under direction in mutual aid collectives", "kicker": "Section 10.1", "html": "<p>The first currency is labor: un-orchestrated physical work under the direction of others. Gutting buildings. Hauling soil. Packing food boxes on Saturday mornings with mutual aid collectives.<\/p><p>\"Un-orchestrated\" is the key word. Friends are good at organizing, and that strength becomes a weakness when it turns every contribution into a project Friends run. Labor under direction means arriving when asked, doing what is needed, and leaving the planning to the people whose community it is.<\/p><p>Jeff's three years with Des Moines Mutual Aid, working alongside Ronnie James, and his work weeks at the Great Plains Action Society land in Iowa City are this currency in practice. The work is ordinary. Its faithfulness over time is what builds the crucible of trust from Chapter 7.<\/p>"}, {"id": "s10_2", "label": "Institutional weight and minuting commitments", "kicker": "Section 10.2", "html": "<p>The second currency is institutional weight. Meetings and Quaker organizations carry platforms, reputations, and access that individuals do not. Spending that weight means handing over platforms, lobbying alongside Native delegations for legislative protections such as Savanna's Act, and minuting binding commitments.<\/p><p>Minuting matters. In Quaker practice, a minute records what the gathered body has discerned. A minute that commits a meeting to a recurring transfer, to a land relationship, or to an annual act of accountability turns a good feeling into a durable institutional obligation. It outlives the enthusiasm of the Friends who first felt led.<\/p><p>Institutional weight is also how Friends can undo some of the institutional harm described in Part II. Meetings ran the boarding schools. Meetings can now put their names, budgets, and standing behind Indigenous-led work.<\/p>"}, {"id": "s10_3", "label": "Unrestricted money as an obligatory honor tax", "kicker": "Section 10.3", "html": "<p>The third currency is unrestricted money, given as recurring transfers and treated as an obligatory honor tax rather than as charity.<\/p><p>Charity implies that the giver decides, that the gift is optional, and that the recipient should be grateful. An honor tax reverses all three: it is owed, it is recurring, and the recipient decides how to use it. \"Unrestricted\" means no strings attached and no reports demanded about whether the money was spent the way donors would have liked.<\/p><p>The source notes offer a model: Iowa Conservative Friends put their entire peace-and-justice budget behind the documentary They Found Us. That was a whole budget line, redirected, in support of telling the truth about the history this book describes. Smaller meetings can follow the same logic at their own scale: name a percentage, make it recurring, and give it without restrictions.<\/p>"}, {"id": "s10_4", "label": "Land return supporting Indigenous stewardship", "kicker": "Section 10.4", "html": "<p>The fourth currency is land. LANDBACK is not a metaphor. It means physical, concrete acreage returned to Indigenous stewardship.<\/p><p>The example closest to this book is the Great Plains Action Society's Urban Resilience Hub at 810 Maiden Lane in Iowa City, about 1.2 acres of land in the downtown area returned to Indigenous hands. The Decolonial Repair Network, created by Sikowis Nobiss and Eric Anglada to support Great Plains Action Society, has organized support and work weeks there.<\/p><p>Land return brings the whole book full circle. The boarding schools of Part II were, in the end, instruments of land taking. Settler Friends live, worship, and farm on land that was taken. A channel built outward honestly must eventually carry the land question with it. Not every meeting can return acreage tomorrow. Every meeting can ask what land it holds, how it came to hold it, and what returning some of that land, or supporting land already returned, would look like.<\/p>"}]}]}], "kicker": "The whole map", "closing": "<p>Do not leave this book with an enlarged vocabulary and an empty calendar.<\/p><p>A channel is made honest only by the work that continues after the reading stops. The map has taken us from the architecture of channels, through the walls that kept the Quaker channel from being built, through the postures and queries that prepare a Friend to share outward, to the four currencies that turn spiritual knowledge into material repair.<\/p><p>The next steps are small and concrete. Find your local silence. Open the county archives. Show up at a door that already exists. Commit to a weekly rhythm. Put your hands in the dirt.<\/p><p>Where water does not reach, it is not because the water does not exist. It is because the channel has not been built. Build it.<\/p>"}</script>
<script>
const root = JSON.parse(document.getElementById('data').textContent);
const byId = {}; const parent = {};
(function idx(n,p,d){ n.depth=d; byId[n.id]=n; if(p) parent[n.id]=p; n.open = d<1; (n.children||[]).forEach(c=>idx(c,n,d+1)); })(root,null,0);
const W = [210, 220, 230, 300], GAP = [56, 50, 50, 0], VGAP = 10;
const canvas = document.getElementById('canvas'), svg = document.getElementById('wires'), stage = document.getElementById('stage'), panel = document.getElementById('panel');
let selected = root.id, scale = 1, tx = 20, ty = 20;
const colX = d => { let x = 0; for (let i = 0; i < d; i++) x += W[i] + GAP[i]; return x; };

function layout(h){
  let y = 0; const pos = {};
  (function place(n){
    const kids = n.open ? (n.children||[]) : [];
    if (!kids.length){ pos[n.id] = y + h[n.id]/2; y += h[n.id] + VGAP; return; }
    const start = y;
    kids.forEach(place);
    let c = (pos[kids[0].id] + pos[kids[kids.length-1].id]) / 2;
    if (c - h[n.id]/2 < start) { const shift = start + h[n.id]/2 - c; kids.forEach(k=>shiftAll(k,shift,pos)); c += shift; y += shift; }
    if (c + h[n.id]/2 + VGAP > y) y = c + h[n.id]/2 + VGAP;
    pos[n.id] = c;
  })(root);
  return pos;
}
function shiftAll(n,s,pos){ pos[n.id]+=s; if(n.open)(n.children||[]).forEach(k=>shiftAll(k,s,pos)); }
function render(){
  canvas.querySelectorAll('.node').forEach(e=>e.remove());
  let paths = '';
  const els = {};
  (function draw(n){
    const el = document.createElement('div');
    el.className = 'node d'+n.depth + (n.id===selected?' sel':'');
    el.style.setProperty('--w', W[n.depth]+'px');
    el.style.left = colX(n.depth)+'px'; el.tabIndex = 0; el.setAttribute('role','button');
    const has = (n.children||[]).length;
    el.innerHTML = '<span class="lbl"></span>' + (has ? '<span class="tog" aria-hidden="true">'+(n.open?'−':'+')+'</span>' : '');
    el.querySelector('.lbl').textContent = n.label;
    el.setAttribute('aria-expanded', has ? String(n.open) : 'false');
    el.onclick = ev => { ev.stopPropagation(); clickNode(n); };
    el.onkeydown = ev => { if (ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); clickNode(n); } };
    canvas.appendChild(el); els[n.id] = el;
    if (n.open) (n.children||[]).forEach(draw);
  })(root);
  // vertically center each node on its row and draw wires
  const hs = {}; Object.entries(els).forEach(([id,el])=>hs[id]=el.offsetHeight);
  const pos = layout(hs);
  Object.entries(els).forEach(([id,el])=>{ el.style.top = (pos[id] - hs[id]/2) + 'px'; });
  (function wire(n){
    if (!n.open) return;
    const a = els[n.id];
    (n.children||[]).forEach(c=>{
      const b = els[c.id];
      const x1 = a.offsetLeft + a.offsetWidth, y1 = a.offsetTop + a.offsetHeight/2;
      const x2 = b.offsetLeft, y2 = b.offsetTop + b.offsetHeight/2, mx = (x1+x2)/2;
      paths += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
      wire(c);
    });
  })(root);
  svg.innerHTML = paths;
  apply();
}
function clickNode(n){
  if ((n.children||[]).length) n.open = !n.open || n.id!==selected ? (n.id===selected ? !n.open : true) : false;
  selected = n.id; render(); show(n); centerOn(n);
}
function trail(n){ const t=[]; let p=parent[n.id]; while(p){ t.unshift(p); p=parent[p.id]; } return t; }
function flat(){ const out=[]; (function f(n){ out.push(n); (n.children||[]).forEach(f); })(root); return out; }
function show(n){
  const t = trail(n);
  let h = '';
  if (t.length) h += '<div class="crumbs">' + t.map(p=>`<span data-go="${p.id}">${esc(p.label)}</span>`).join(' › ') + '</div>';
  h += `<div class="kick">${esc(n.kicker||'')}</div><h2>${esc(n.label)}</h2>` + n.html;
  if ((n.children||[]).length){
    h += '<div class="kids"><h5>Branches</h5>' + n.children.map(c=>`<button data-go="${c.id}">${esc(c.label)}</button>`).join('') + '</div>';
  }
  if (n.closing) h += '<div class="closing"><div class="kick">Closing charge</div>' + n.closing + '</div>';
  const all = flat(), i = all.indexOf(n);
  h += '<div class="nav">' + (i>0?`<button data-go="${all[i-1].id}">← ${esc(all[i-1].label)}</button>`:'<span></span>') + (i<all.length-1?`<button data-go="${all[i+1].id}">${esc(all[i+1].label)} →</button>`:'') + '</div>';
  panel.innerHTML = h; panel.scrollTop = 0;
  panel.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(byId[b.dataset.go]));
}
function go(n){ trail(n).forEach(p=>p.open=true); if((n.children||[]).length) n.open=true; selected=n.id; render(); show(n); centerOn(n); }
function centerOn(n){
  const el = [...canvas.querySelectorAll('.node')].find(e=>e.classList.contains('sel')); if(!el) return;
  const r = stage.getBoundingClientRect();
  const cx = el.offsetLeft + el.offsetWidth/2, cy = el.offsetTop + el.offsetHeight/2;
  const sx = cx*scale + tx, sy = cy*scale + ty;
  if (sx < 40 || sx > r.width-40 || sy < 40 || sy > r.height-40){ tx = r.width/2 - cx*scale; ty = r.height/2 - cy*scale; apply(); }
}
const esc = s => s.replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function apply(){ canvas.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; }
function fit(){
  const nodes = [...canvas.querySelectorAll('.node')]; if(!nodes.length) return;
  let w=0,h=0; nodes.forEach(e=>{ w=Math.max(w,e.offsetLeft+e.offsetWidth); h=Math.max(h,e.offsetTop+e.offsetHeight); });
  const r = stage.getBoundingClientRect();
  scale = Math.max(0.35, Math.min(1.2, (r.width-40)/w, (r.height-40)/h));
  tx = (r.width - w*scale)/2; ty = Math.max(20,(r.height - h*scale)/2); apply();
}
function zoom(f, cx, cy){
  const r = stage.getBoundingClientRect(); cx = cx ?? r.width/2; cy = cy ?? r.height/2;
  const ns = Math.max(0.3, Math.min(2.2, scale*f));
  tx = cx - (cx-tx)*ns/scale; ty = cy - (cy-ty)*ns/scale; scale = ns; apply();
}
document.getElementById('expand').onclick = ()=>{ flat().forEach(n=>n.open=true); render(); fit(); };
document.getElementById('collapse').onclick = ()=>{ flat().forEach(n=>n.open=n.depth<1); selected=root.id; render(); fit(); show(root); };
document.getElementById('zin').onclick = ()=>zoom(1.2);
document.getElementById('zout').onclick = ()=>zoom(1/1.2);
document.getElementById('fit').onclick = fit;
stage.addEventListener('wheel', e=>{ e.preventDefault(); const r=stage.getBoundingClientRect(); zoom(e.deltaY<0?1.1:1/1.1, e.clientX-r.left, e.clientY-r.top); }, {passive:false});
let drag=null;
stage.addEventListener('pointerdown', e=>{ if(e.target.closest('.node')) return; drag={x:e.clientX,y:e.clientY,tx,ty}; stage.classList.add('drag'); stage.setPointerCapture(e.pointerId); });
stage.addEventListener('pointermove', e=>{ if(!drag) return; tx=drag.tx+e.clientX-drag.x; ty=drag.ty+e.clientY-drag.y; apply(); });
stage.addEventListener('pointerup', ()=>{ drag=null; stage.classList.remove('drag'); });
window.addEventListener('resize', ()=>{});
render(); fit(); show(root);
</script>
</body>
